<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dishcovery Site Login</title>
    <link rel="stylesheet" href="Marwan-Registry.css">
</head>
<body>
    <div class="container">
        <div id="login" class="form active">
            <h2>Login</h2>
            <input type="text" id="login-username" placeholder="Username">
            <input type="password" id="login-password" placeholder="Password">
            <button  onclick="login()">Login</button>
            <div class="switch-link">
                Don't have an account? <a href="#" onclick="showForm('signup')"><u>Sign up</u></a>
            </div>
        </div>
        <div id="signup" class="form">
            <h2>Sign up</h2>
            <input type="email" id="signup-email" placeholder="Email">
            <input type="password" id="signup-password" placeholder="Password">
            <button onclick="signup()">Sign Up</button>
            <div class="switch-link">
                Already have an account? <a href="#" onclick="showForm('login')"><u>Log in</u></a>
            </div>
        </div>
        <div id="message"></div>
    </div>

    <script src="Marwan-Registry.js"></script>
</body>
</html>
